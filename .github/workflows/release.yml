name: Release

# Publish a release on GitHub (Releases → Draft a new release, tag like v2.1.0).
# This workflow then builds the add-on for that tag and attaches
# ddev-bridge.tar.gz and its .sha256 to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $TAG (expected vX.Y.Z)"; exit 1; }
      - name: Test and build
        run: make package VERSION="$TAG"
      - name: Check the binaries
        run: |
          ./ddev-bridge-dist/host/linux-amd64/ddev-bridge version | grep -qx "$TAG"
          for f in ddev-bridge-dist/host/*/ddev-bridge ddev-bridge-dist/client/*/ddev-bridge-client; do
            grep -aq '#ddev-generated' "$f" || { echo "missing add-on marker: $f"; exit 1; }
          done
          (cd dist && sha256sum ddev-bridge.tar.gz > ddev-bridge.tar.gz.sha256)
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/ddev-bridge.tar.gz dist/ddev-bridge.tar.gz.sha256 --clobber
