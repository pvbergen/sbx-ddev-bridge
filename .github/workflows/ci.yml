name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # make package runs make test first, then builds all binaries and the
      # tarball. Nothing is uploaded; the release workflow publishes packages.
      - name: Test and test-build the add-on package
        run: |
          make package VERSION="ci-${GITHUB_SHA::7}"
          tar -tzf dist/ddev-bridge.tar.gz ddev-bridge/install.yaml >/dev/null
