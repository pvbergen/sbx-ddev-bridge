name: Release

# Push a tag like v2.1.0 (or run manually with a tag) to build the add-on and
# publish it as a GitHub release with dist/ddev-bridge.tar.gz attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create and release, e.g. v2.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
      - name: Test and build
        run: make package VERSION="$TAG"
      - name: Check the binaries
        run: |
          ./ddev-bridge-dist/host/linux-amd64/ddev-bridge version | grep -qx "$TAG"
          for f in ddev-bridge-dist/host/*/ddev-bridge ddev-bridge-dist/client/*/ddev-bridge-client; do
            grep -aq '#ddev-generated' "$f" || { echo "missing add-on marker: $f"; exit 1; }
          done
          (cd dist && sha256sum ddev-bridge.tar.gz > ddev-bridge.tar.gz.sha256)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
          gh release create "$TAG" dist/ddev-bridge.tar.gz dist/ddev-bridge.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "ddev-bridge $TAG" --generate-notes $pre
