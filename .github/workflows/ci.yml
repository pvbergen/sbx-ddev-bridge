name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Build the add-on package
        run: make package VERSION="ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: ddev-bridge-package
          path: dist/ddev-bridge.tar.gz
          retention-days: 14
